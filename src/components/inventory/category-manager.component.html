<div
  class="mt-3 p-3 border rounded-md dark:border-gray-700 bg-gray-50 dark:bg-gray-900"
>
  <div class="flex items-center justify-between">
    <h4 class="font-semibold text-gray-800 dark:text-gray-100">
      Manage Categories
    </h4>
  </div>

  <!-- Add -->
  <div class="flex gap-2 mt-3">
    <input
      class="flex-1 input-style"
      type="text"
      placeholder="New category name"
      [value]="newName()"
      (input)="newName.set($any($event.target).value)"
      (keyup.enter)="add()"
    />
    <button
      type="button"
      (click)="add()"
      class="px-3 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700"
    >
      Add
    </button>
  </div>

  <!-- List -->
  <div class="mt-3 max-h-48 overflow-auto space-y-2">
    <div
      *ngFor="let c of categories()"
      class="flex items-center gap-2 p-2 rounded-md bg-white dark:bg-gray-800 border dark:border-gray-700"
    >
      <ng-container *ngIf="editingId() !== c.id; else editTpl">
        <span class="flex-1 text-gray-800 dark:text-gray-100">{{
          c.name
        }}</span>

        <button
          type="button"
          (click)="startEdit(c)"
          class="px-2 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600"
        >
          Edit
        </button>
        <button
          type="button"
          (click)="remove(c.id)"
          class="px-2 py-1 text-sm bg-red-600 text-white rounded hover:bg-red-700"
        >
          Delete
        </button>
      </ng-container>

      <ng-template #editTpl>
        <input
          class="flex-1 input-style"
          type="text"
          [value]="editName()"
          (input)="editName.set($any($event.target).value)"
          (keyup.enter)="saveEdit(c.id)"
        />
        <button
          type="button"
          (click)="saveEdit(c.id)"
          class="px-2 py-1 text-sm bg-green-600 text-white rounded hover:bg-green-700"
        >
          Save
        </button>
        <button
          type="button"
          (click)="cancelEdit()"
          class="px-2 py-1 text-sm bg-gray-200 rounded hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600"
        >
          Cancel
        </button>
      </ng-template>
    </div>
  </div>
</div>
