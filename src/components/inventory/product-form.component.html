<div
  class="fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center"
  (click)="onCancel()"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div
      class="flex justify-between items-center p-4 border-b dark:border-gray-700"
    >
      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100">
        {{ isEditMode ? "Edit Product" : "Add New Product" }}
      </h2>
      <button
        (click)="onCancel()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form
      [formGroup]="productForm"
      (ngSubmit)="onSubmit()"
      class="p-6 overflow-y-auto space-y-4"
    >
      <!-- Name and Category -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label
            for="name"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Product Name</label
          >
          <input
            type="text"
            id="name"
            formControlName="name"
            class="mt-1 block w-full input-style"
          />
        </div>
        <div>
          <label
            for="category"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Category</label
          >
          @if (!isAddingCategory()) {
            <div class="flex items-center mt-1 space-x-2">
              <select formControlName="categoryId">
                <option [ngValue]="null" disabled>Select category</option>

                <option *ngFor="let c of categories()" [ngValue]="c.id">
                  {{ c.name }}
                </option>
              </select>

              <button
                type="button"
                (click)="isAddingCategory.set(true)"
                title="Add new category"
                class="p-2 text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300 flex-shrink-0"
              >
                <svg
                  class="w-6 h-6"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
              </button>
            </div>
          } @else {
            <div class="flex items-center mt-1 space-x-2">
              <input
                type="text"
                placeholder="New category name"
                class="block w-full input-style"
                [value]="newCategoryName()"
                (input)="newCategoryName.set($any($event.target).value)"
                (keyup.enter)="addNewCategory()"
              />
              <button
                type="button"
                (click)="addNewCategory()"
                class="px-3 py-2 bg-indigo-600 text-white rounded-md text-sm hover:bg-indigo-700"
              >
                Add
              </button>
              <button
                type="button"
                (click)="isAddingCategory.set(false)"
                class="px-3 py-2 bg-gray-200 text-gray-800 rounded-md text-sm hover:bg-gray-300 dark:bg-gray-600 dark:text-gray-200 dark:hover:bg-gray-500"
              >
                Cancel
              </button>
            </div>
          }
        </div>
      </div>

      <!-- Description -->
      <div>
        <label
          for="description"
          class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >Description</label
        >
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="mt-1 block w-full input-style"
        ></textarea>
      </div>

      <!-- Pricing -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label
            for="price"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Sale Price</label
          >
          <input
            type="number"
            id="price"
            formControlName="price"
            class="mt-1 block w-full input-style"
            step="0.01"
          />
        </div>
        <div>
          <label
            for="costPrice"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Cost Price</label
          >
          <input
            type="number"
            id="costPrice"
            formControlName="costPrice"
            class="mt-1 block w-full input-style"
            step="0.01"
          />
        </div>
      </div>

      <!-- Stock Levels -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label
            for="quantityInStock"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Stock Quantity</label
          >
          <input
            type="number"
            id="quantityInStock"
            formControlName="quantityInStock"
            class="mt-1 block w-full input-style"
          />
        </div>
        <div>
          <label
            for="minStockLevel"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Min Stock Level</label
          >
          <input
            type="number"
            id="minStockLevel"
            formControlName="minStockLevel"
            class="mt-1 block w-full input-style"
          />
        </div>
        <div>
          <label
            for="reorderQuantity"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Reorder Quantity</label
          >
          <input
            type="number"
            id="reorderQuantity"
            formControlName="reorderQuantity"
            class="mt-1 block w-full input-style"
          />
        </div>
      </div>

      <!-- Footer with Actions -->
      <div class="flex justify-end pt-4 border-t dark:border-gray-700">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 mr-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 dark:bg-gray-600 dark:text-gray-200 dark:hover:bg-gray-500"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="productForm.invalid"
          class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 disabled:bg-gray-400"
        >
          {{ isEditMode ? "Save Changes" : "Add Product" }}
        </button>
      </div>
    </form>
  </div>
</div>

<style>
  .input-style {
    @apply px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white;
  }
</style>
